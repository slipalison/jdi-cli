# SonarCloud automatic analysis configuration.
#
# runtimes/ is BUILD OUTPUT: bin/jdi-build.{sh,ps1} generates one adapter per
# runtime (claude/copilot/antigravity/opencode/junie) from the single source
# of truth in core/. The same command body intentionally exists in up to five
# generated formats, so cross-file duplication there is by construction, not
# tech debt. Duplication remains measured on real sources (core/, bin/, docs).
sonar.cpd.exclusions=runtimes/**
