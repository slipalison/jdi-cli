# JDI — artifact gate for pull requests opened by coding agents.
#
# The safety net behind the pre-commit hook: a PR from a delegated agent
# (branch `copilot/*`) that touches production code MUST carry the complete
# JDI phase chain — CONTEXT, PLAN, SUMMARY, REVIEW (verdict not BLOCKED /
# not PENDING_MANUAL) and SHIPPED — validated by `jdi-cli validate-phase`.
# Prose is optimized away by agents; a red check is not.
#
# Human branches are exempt by design (interactive JDI has its own gates).
# Code paths default to `src/**`; override in .jdi/config.json:
#   { "gate": { "code_globs": ["src/**", "app/**"] } }
#
# NOTE for PRs from agents: workflows only run after a maintainer clicks
# "Approve and run workflows" on the PR — without that click no gate runs.
name: JDI artifacts gate

on:
  pull_request:

jobs:
  jdi-artifacts-gate:
    # Gate only delegated-agent PRs. Extend the condition if your agents
    # push to other branch prefixes.
    if: startsWith(github.head_ref, 'copilot/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request checks out the test-merge commit; fetch-depth 2 brings
          # its two parents' trees so `git diff HEAD^1 HEAD` resolves (default
          # depth 1 leaves the parents as shallow grafts -> the diff fails on
          # the very copilot/* PRs this gate is meant to pass). 2 is the
          # minimal correct depth for a first-parent diff of a merge commit.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JDI phase artifacts
        run: |
          set -euo pipefail

          # On pull_request the checkout is the merge commit: parent 1 = base.
          CHANGED=$(git diff --name-only HEAD^1 HEAD)
          echo "--- files in PR ---"; echo "$CHANGED"; echo "-------------------"

          # Conflict-free layout (v3): with .jdi/roadmap/ present, the old
          # single-file paths are UNTRACKED views rendered from the per-entry
          # dirs, and LEGACY* files are frozen history. A PR that commits any
          # of them re-creates the multi-writer conflict class v3 removes
          # (server-side PR merges ignore .gitattributes merge=union).
          if [ -d .jdi/roadmap ]; then
            BAD=$(echo "$CHANGED" | grep -E '^\.jdi/(ROADMAP\.md|DECISIONS\.md|todos\.md|registry\.md|specialists\.md|reviewers\.md|skills-registry\.md|(roadmap|decisions|todos|registry)/LEGACY[^/]*)$' || true)
            if [ -n "$BAD" ]; then
              echo "::error::PR commits generated views or frozen LEGACY files:"
              echo "$BAD" | while IFS= read -r f; do echo "::error::  $f"; done
              echo "::error::Write per-entry files instead (.jdi/roadmap/<slug>.md, .jdi/decisions/D-{date}-{slug}-{seq}.md, .jdi/todos/{date}-{slug}.md, .jdi/registry/R-{date}-{slug}.md), run 'npx -y jdi-cli render', and drop the old paths from the PR."
              exit 1
            fi
          fi

          # code globs from .jdi/config.json (gate.code_globs) or default src/**
          GLOBS=""
          if [ -f .jdi/config.json ]; then
            GLOBS=$(tr -d '\n' < .jdi/config.json \
              | sed -n 's/.*"code_globs"[[:space:]]*:[[:space:]]*\[\([^]]*\)\].*/\1/p' \
              | tr ',' '\n' | sed 's/[" ]//g' | tr '\n' ' ')
          fi
          [ -n "${GLOBS// /}" ] || GLOBS="src/**"

          # glob -> ERE ( ** crosses /, * does not )
          glob_to_re() {
            printf '%s' "$1" | sed -e 's/[.[\%^$+()]/\\&/g' \
              -e 's/\*\*/\x01/g' -e 's/\*/[^\/]*/g' -e 's/\x01/.*/g' \
              -e 's/^/^/' -e 's/$/$/'
          }

          CODE_TOUCHED=""
          for g in $GLOBS; do
            RE=$(glob_to_re "$g")
            HIT=$(echo "$CHANGED" | grep -E "$RE" | head -1 || true)
            [ -n "$HIT" ] && { CODE_TOUCHED="$HIT"; break; }
          done

          SLUGS=$(echo "$CHANGED" | sed -n 's#^\.jdi/phases/\([^/]*\)/.*#\1#p' | sort -u)

          if [ -z "$CODE_TOUCHED" ] && [ -z "$SLUGS" ]; then
            echo "gate: no code and no phase artifacts touched — nothing to validate."
            exit 0
          fi

          if [ -n "$CODE_TOUCHED" ] && [ -z "$SLUGS" ]; then
            echo "::error::PR touches code ($CODE_TOUCHED) but contains NO .jdi/phases/<slug>/ artifacts."
            echo "::error::The JDI flow is mandatory for delegated issues: CONTEXT -> PLAN -> code -> REVIEW -> SUMMARY -> SHIPPED."
            echo "::error::Create the artifacts (see any existing .jdi/phases/ folder) and commit them in this PR."
            exit 1
          fi

          # Pin the validator to the version this repo declares (.jdi/VERSION,
          # written by `jdi-cli install`/`update`). Unpinned `npx -y jdi-cli`
          # means @latest: a new release could flip a previously-valid PR red
          # with zero repo change (0.12.0->0.12.1 did exactly that). The pin
          # is self-maintaining — updating JDI moves it. Fallback: latest.
          JDI_VER=$(tr -d '[:space:]' < .jdi/VERSION 2>/dev/null || true)
          if [ -n "$JDI_VER" ]; then JDI_PIN="jdi-cli@$JDI_VER"; else JDI_PIN="jdi-cli"; fi
          echo "validator: $JDI_PIN"

          FAIL=0
          for slug in $SLUGS; do
            echo ""
            echo "=== validate-phase $slug (--for-pr) ==="
            npx -y "$JDI_PIN" validate-phase "$slug" --for-pr || FAIL=1
          done

          exit $FAIL
