name: Publish to npm

# Dispara quando voce empurra uma tag no formato v*.*.* (ex: v1.6.0).
# Fluxo recomendado:
#   1. Bump em package.json
#   2. Commit + push main
#   3. git tag -a v1.6.0 -m "..." && git push origin v1.6.0
#   4. Action publica automatico

on:
  push:
    tags:
      - "v*.*.*"
  # Permite trigger manual no UI tambem (Actions tab > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex: v1.6.0). Deve existir no repo."
        required: true
        type: string

permissions:
  contents: read
  # Necessario pra `npm publish --provenance` (OIDC com sigstore)
  id-token: write

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve tag (aceita "1.6.0" ou "v1.6.0")
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          # Normaliza: garante prefixo v
          if [[ "$RAW" != v* ]]; then
            RAW="v${RAW}"
          fi
          echo "tag=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
          echo "Tag normalizada: ${RAW} (versao: ${RAW#v})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tag normalizada com prefixo v
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Registry URL eh OBRIGATORIO aqui — define onde o NPM_TOKEN injeta
          registry-url: "https://registry.npmjs.org"
          # cache: 'npm'  # JDI nao tem package-lock.json (zero deps)

      - name: Verify tag matches package.json
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${{ steps.resolve.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag ver:  $TAG_VERSION"
          echo "Pkg ver:  $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != package.json ($PKG_VERSION). Aborta."
            exit 1
          fi

      - name: Verify runtimes are in sync (no rebuild)
        shell: bash
        run: |
          # CI nao rebuilda — runtimes/ commitado eh source-of-truth.
          # Se voce esqueceu de rodar `jdi build` antes do tag, o publish
          # ainda vai funcionar (publica o que esta no disco), mas as
          # runtimes/ podem estar desync com core/. Solucao: rodar
          # `node bin/jdi.js build` local, commitar, e re-tagear.
          test -d runtimes/claude/agents
          test -d runtimes/copilot/agents
          test -d runtimes/antigravity/skills
          test -d runtimes/opencode/agents
          echo "runtimes/ presentes — usando o que esta commitado"

      - name: Verify shell scripts carry the exec bit
        shell: bash
        run: |
          # 0.12.0 shipped every .sh at mode 100644 -> validate-phase died with
          # "Permission denied" and installed git hooks were silently ignored.
          # A published tarball preserves git file modes, so guard the release:
          # any tracked .sh or git-hook at 100644 fails the publish.
          set -euo pipefail
          BAD=$(git ls-files -s -- '*.sh' 'bin/git-hooks/pre-commit' 'bin/git-hooks/post-commit' \
                | awk '$1 == "100644" { print $4 }')
          if [ -n "$BAD" ]; then
            echo "::error::These scripts lack the exec bit (100644). Fix: git update-index --chmod=+x <file>"
            echo "$BAD"
            exit 1
          fi
          echo "All shell scripts + git hooks are executable (100755)."

      - name: Verify .ps1 scripts are ASCII-only (PS 5.1 safety)
        shell: bash
        run: |
          # Windows PowerShell 5.1 decodes BOM-less .ps1 as ANSI (cp1252):
          # a single em dash decoded as cp1252 yields a smart quote that the
          # parser treats as a string delimiter and the whole script fails to
          # parse (issue #24). jdi.js prefers pwsh when present, but 5.1 is
          # the fallback on stock Windows — so scripts must stay ASCII-only.
          set -euo pipefail
          BAD=""
          while IFS= read -r f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              BAD="$BAD$f"$'\n'
            fi
          done < <(git ls-files '*.ps1')
          if [ -n "$BAD" ]; then
            echo "::error::These .ps1 files contain non-ASCII bytes (PS 5.1 reads BOM-less files as ANSI and breaks). Replace with ASCII:"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "All tracked .ps1 files are ASCII-only."

      - name: Verify package contents (dry-run)
        shell: bash
        run: npm publish --dry-run

      - name: Publish to npm
        shell: bash
        env:
          # Secret NPM_TOKEN configurado em Settings > Secrets and variables > Actions
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --provenance: assina o build via OIDC (sigstore). Aparece como
          # badge "Provenance" na pagina do pacote no npmjs.com.
          # --access public: pacote nao-scoped publicado como public.
          npm publish --provenance --access public

      - name: Summary
        if: success()
        shell: bash
        run: |
          PKG_VERSION="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          echo "## jdi-cli@${PKG_VERSION} publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/jdi-cli/v/${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
