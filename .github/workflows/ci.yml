name: CI

# Pull requests and main: unit tests on Linux and Windows, the release guards
# of the npm publish (exec bit, ASCII .ps1), and the build-drift check —
# runtimes/ is generated from core/ by two builders (bash and PowerShell) that
# must produce exactly the committed bytes.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node test/run.js

  build-drift:
    name: Build drift (bash + PowerShell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same guards the npm publish runs on the tag: a PR must fail here,
      # not the release (0.17 shipped an em dash in a .ps1 that only the
      # publish job would have caught).
      - name: Shell scripts carry the exec bit
        run: |
          BAD=$(git ls-files -s -- '*.sh' 'bin/git-hooks/pre-commit' 'bin/git-hooks/post-commit' | awk '$1 == "100644" { print $4 }')
          if [ -n "$BAD" ]; then echo "::error::scripts without the exec bit (git update-index --chmod=+x):"; echo "$BAD"; exit 1; fi

      - name: .ps1 scripts are ASCII-only (Windows PowerShell 5.1 reads them as ANSI)
        run: |
          # grep -l exits 1 when nothing matches; under `bash -e -o pipefail` that must not end the step
          BAD=$(git ls-files -z '*.ps1' | LC_ALL=C xargs -0 -r grep -lP '[^\x00-\x7F]' || true)
          if [ -n "$BAD" ]; then echo "::error::non-ASCII bytes in:"; echo "$BAD"; exit 1; fi

      - name: Build with bash
        run: bash bin/jdi-build.sh

      - name: runtimes/ matches the committed build (bash)
        run: git diff --exit-code -- runtimes/

      - name: Build with PowerShell
        shell: pwsh
        run: ./bin/jdi-build.ps1

      - name: runtimes/ matches the committed build (PowerShell)
        run: git diff --exit-code -- runtimes/
