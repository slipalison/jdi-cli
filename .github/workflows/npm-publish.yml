name: Publish to npm

# Releases on merge. Every push to main runs `decidir`: when the version in
# package.json has no tag yet (a release PR bumped it), `publicar` publishes
# it to npm, then creates the tag vX.Y.Z on that commit and the GitHub Release
# with the version's CHANGELOG section as notes. A merge that does not bump
# the version publishes nothing.
#
# Flow: PR "chore(release): X.Y.Z" (package.json + lock, CHANGELOG `## [X.Y.Z]`,
# runtimes rebuilt) -> merge -> this workflow. Up to 0.18.x a tag had to be
# pushed by hand and the GitHub Release made with `gh release create`; it was
# forgotten from 0.18.0 on (tags without Releases, the panel stuck at v0.15.0).
#
# Still accepted: pushing a tag v*.*.* (publishes that tag) and a manual run
# with an existing tag (Actions tab > Run workflow). A tag pushed by this
# workflow with GITHUB_TOKEN does not start another run (GitHub rule), so a
# version is never published twice.

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  # Permite trigger manual no UI tambem (Actions tab > Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex: v1.6.0). Deve existir no repo."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  decidir:
    name: Decide the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        shell: bash
        # By env, never interpolated into the script: the dispatch input is
        # typed by whoever runs the workflow, and `${{ }}` inside `run:` is
        # pasted into the bash text before bash reads it.
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            V=$(node -p "require('./package.json').version")
            TAG="v$V"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "$TAG already exists: this merge does not bump the version — nothing to publish."
              exit 0
            fi
            if ! grep -q "^## \[$V\]" CHANGELOG.md; then
              echo "::error::package.json is at $V (no tag yet) but CHANGELOG.md has no '## [$V]' section — the release notes come from it."
              exit 1
            fi
            REF="$SHA"
          else
            # Normaliza: garante prefixo v
            TAG="$RAW_TAG"
            if [[ "$TAG" != v* ]]; then TAG="v${TAG}"; fi
            V="${TAG#v}"
            REF="$TAG"
          fi
          {
            echo "release=true"
            echo "tag=$TAG"
            echo "version=$V"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG from $REF"

  publish:
    name: Build + publish
    needs: decidir
    if: needs.decidir.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # tag + GitHub Release
      contents: write
      # Necessario pra `npm publish --provenance` (OIDC com sigstore)
      id-token: write

    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        env:
          TAG: ${{ needs.decidir.outputs.tag }}
          VERSION: ${{ needs.decidir.outputs.version }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.decidir.outputs.ref }}
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # npm staged publishing (GA May 2026) needs Node >= 22.14 and npm >= 11.15;
          # trusted publishing (OIDC) needs npm >= 11.5.1. Node 22 bundles npm 10.x,
          # so the next step upgrades the CLI.
          node-version: "22"
          # Registry URL eh OBRIGATORIO aqui — define onde o NPM_TOKEN injeta
          registry-url: "https://registry.npmjs.org"
          # sem cache: zero dependencias, nada a baixar

      - name: Upgrade npm CLI (staged publishing / trusted publishing)
        shell: bash
        run: |
          # Pinned (S8543) + --ignore-scripts (S6505); bump deliberately.
          npm install -g npm@12.0.2 --ignore-scripts
          npm --version

      - name: Verify tag matches package.json
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${{ steps.resolve.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Tag ver:  $TAG_VERSION"
          echo "Pkg ver:  $PKG_VERSION"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) != package.json ($PKG_VERSION). Aborta."
            exit 1
          fi

      - name: Verify runtimes are in sync (no rebuild)
        shell: bash
        run: |
          # CI nao rebuilda — runtimes/ commitado eh source-of-truth.
          # Se voce esqueceu de rodar `jdi build` antes do tag, o publish
          # ainda vai funcionar (publica o que esta no disco), mas as
          # runtimes/ podem estar desync com core/. Solucao: rodar
          # `node bin/jdi.js build` local, commitar, e re-tagear.
          test -d runtimes/claude/agents
          test -d runtimes/copilot/agents
          test -d runtimes/antigravity/skills
          test -d runtimes/opencode/agents
          test -d runtimes/junie/agents
          echo "runtimes/ presentes — usando o que esta commitado"

      - name: Verify shell scripts carry the exec bit
        shell: bash
        run: |
          # 0.12.0 shipped every .sh at mode 100644 -> validate-phase died with
          # "Permission denied" and installed git hooks were silently ignored.
          # A published tarball preserves git file modes, so guard the release:
          # any tracked .sh or git-hook at 100644 fails the publish.
          set -euo pipefail
          BAD=$(git ls-files -s -- '*.sh' 'bin/git-hooks/pre-commit' 'bin/git-hooks/post-commit' \
                | awk '$1 == "100644" { print $4 }')
          if [ -n "$BAD" ]; then
            echo "::error::These scripts lack the exec bit (100644). Fix: git update-index --chmod=+x <file>"
            echo "$BAD"
            exit 1
          fi
          echo "All shell scripts + git hooks are executable (100755)."

      - name: Verify .ps1 scripts are ASCII-only (PS 5.1 safety)
        shell: bash
        run: |
          # Windows PowerShell 5.1 decodes BOM-less .ps1 as ANSI (cp1252):
          # a single em dash decoded as cp1252 yields a smart quote that the
          # parser treats as a string delimiter and the whole script fails to
          # parse (issue #24). jdi.js prefers pwsh when present, but 5.1 is
          # the fallback on stock Windows — so scripts must stay ASCII-only.
          set -euo pipefail
          BAD=""
          while IFS= read -r f; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              BAD="$BAD$f"$'\n'
            fi
          done < <(git ls-files '*.ps1')
          if [ -n "$BAD" ]; then
            echo "::error::These .ps1 files contain non-ASCII bytes (PS 5.1 reads BOM-less files as ANSI and breaks). Replace with ASCII:"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "All tracked .ps1 files are ASCII-only."

      - name: Verify package contents (dry-run)
        shell: bash
        run: npm publish --dry-run

      - name: Publish to npm
        id: publish
        shell: bash
        env:
          # Secret NPM_TOKEN configurado em Settings > Secrets and variables > Actions.
          # Granular tokens created since npm's staged-publishing rollout are
          # stage-only: they can queue a version but a maintainer must approve
          # it with 2FA. (Trusted publishing/OIDC removes the token entirely:
          # configure it on npmjs.com and drop this env var.)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --provenance: assina o build via OIDC (sigstore). Aparece como
          # badge "Provenance" na pagina do pacote no npmjs.com.
          # --access public: pacote nao-scoped publicado como public.
          #
          # Direct publish first; a stage-only credential answers
          # E_STAGE_REQUIRED, in which case the version is STAGED instead and
          # the summary step prints the approval instructions.
          set +e
          OUT=$(npm publish --provenance --access public 2>&1); RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An earlier run published it and failed before the tag/Release:
          # finish the job instead of failing on every later merge.
          if echo "$OUT" | grep -qiE "EPUBLISHCONFLICT|cannot publish over"; then
            echo "::notice::$(node -p "require('./package.json').version") is already on npm — only the tag and the Release are missing."
            echo "mode=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$OUT" | grep -q "E_STAGE_REQUIRED"; then
            exit "$RC"
          fi
          echo "::notice::This credential is stage-only (E_STAGE_REQUIRED) — staging the version for maintainer approval."
          npm stage publish --provenance --access public
          echo "mode=staged" >> "$GITHUB_OUTPUT"

      - name: Staged — approval required
        if: steps.publish.outputs.mode == 'staged'
        shell: bash
        run: |
          V="${{ steps.resolve.outputs.version }}"
          echo "::warning::jdi-cli@$V is STAGED, not live. A maintainer must approve it with 2FA: npmjs.com > jdi-cli > Staged Packages > Approve, or: npm stage list jdi-cli && npm stage approve <stage-id> --otp <code>"
          {
            echo "## jdi-cli@$V staged — approval required"
            echo ""
            echo "The publish credential is stage-only (npm staged publishing). Approve with 2FA:"
            echo ""
            echo "- npmjs.com → package **jdi-cli** → **Staged Packages** → Approve, or"
            echo '- `npm stage list jdi-cli` then `npm stage approve <stage-id> --otp <code>`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag + GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ needs.decidir.outputs.ref }}
          MODE: ${{ steps.publish.outputs.mode }}
        run: |
          set -euo pipefail
          # Notes: the version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ "$MODE" = "staged" ]; then
            printf '\n> npm: staged — live once a maintainer approves it with 2FA.\n' >> "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Merge path: the tag does not exist yet — --target creates it on
          # the published commit. Tag path: it exists and is used as is.
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Summary
        if: success()
        shell: bash
        run: |
          PKG_VERSION="${{ steps.resolve.outputs.version }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          echo "## jdi-cli@${PKG_VERSION} publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/jdi-cli/v/${PKG_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: ${TAG}" >> "$GITHUB_STEP_SUMMARY"
